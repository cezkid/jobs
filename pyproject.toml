[project]
name = "jobs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]
