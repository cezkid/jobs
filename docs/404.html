  :root {

  *, *::before, *::after { box-sizing: border-box; }

  footer p { margin: 0 auto 0 0; }
  /* phones: brand + 3 links don't fit 360px => Source code only in the footer */
  @media (max-width: 600px) {
    .top { gap: 12px; }
    .links { gap: 14px; font-size: 1.0625rem; }

  /* under 360px (320px phones) the links may drop below the brand */
  @media (max-width: 359px) { .top { flex-wrap: wrap; row-gap: 6px; } }
  /* print: ink on white in either scheme (body, not :root: the token table reads :root), no nav */

  @media (prefers-reduced-motion: no-preference) {
