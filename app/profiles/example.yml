# Example search: remote US first, one city area second. Swap category + cities for user's own.
# Probe every value before keeping it (uv run app/jobs.py probe); unknown slug answers 0, not error.
# Outside tech seniority, work_mode, employment_type null on most rows (docs/jobs/freehire.md) => not filtered here.

profile:
  name: finance jobs

# Order = rank tier order. Row matching two passes keeps LAST pass's tier.
passes:
  - tier: remote
    label: Remote US
    params:
      category: [finance]
      # remote rows always carry work_mode => safe filter here
      work_mode: [remote]
      countries: [us]
      # bounds fetch only; novelty = seen table
      posted_within_days: 3
      sort: posted_at
      order: desc
  - tier: local
    label: Springfield area
    params:
      category: [finance]
      # exact /geo/cities values (uv run app/jobs.py probe --city springfield); cities alone -
      # geography facets OR together (docs/jobs/freehire.md)
      cities: [Springfield]
      sort: posted_at
      order: desc

# Applied before ranking, case-insensitive. companies = slug or company name (Inc/LLC ignored);
# categories = enrichment.category, local only.
blocklist:
  # jobgether reposter; builtin-integration-sandbox test postings w/o requirements (docs/jobs/freehire.md)
  companies: [jobgether, builtin-integration-sandbox]
  sources: []
  categories: []
  # whole words/phrases in title ("intern" never hides "Internal Auditor");
  # preview: uv run app/jobs.py rank --would-hide "<phrase>"
  title_phrases: []

# other rank keys + what they do: app/defaults.yml
rank:
  # fortune500 spans every field; bigtech/unicorn/yc only mean something in tech
  boost_collections: [fortune500]
  # yearly USD, top of posted range; boost only, never filter
  salary_floor_usd: 60000
