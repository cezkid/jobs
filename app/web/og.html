<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEZ Job Finder share image</title>
<!-- Source of docs/og.png (1200x630): uv run app/web/assets.py --only og. Tokens + hero app window
     copied from docs/index.html. Bottom 90px kept clear (X lays its headline there); key
     content inside the central 1100x530. Never put the install line on the card. -->
<style>
  @font-face { font-family: "Caladea"; src: url("/fonts/caladea-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Caladea"; src: url("/fonts/caladea-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; }
  :root { --paper: #ffffff; --ink: #000000; --ink-2: #3a3a3a; --mark: #ffe433; --line: #c8c8c8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: var(--paper); color: var(--ink);
    font: 24px/1.4 "Caladea", serif;
  }
  mark { background: var(--mark); color: var(--ink); padding: 0 0.1em; white-space: nowrap; }

  .top { position: absolute; left: 50px; right: 50px; top: 50px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  .brand svg { width: 44px; height: 44px; }
  .site { font-size: 22px; color: var(--ink-2); }

  .intro { position: absolute; left: 50px; top: 150px; width: 520px; }
  h1 { margin: 0; font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -0.005em; }
  .lede { margin: 28px 0 0; font-size: 26px; line-height: 1.35; color: var(--ink-2); }

  /* app window, as the hero on docs/index.html (Windows title bar) */
  figure { position: absolute; right: 56px; top: 132px; width: 540px; margin: 0; isolation: isolate; }
  .window { position: relative; background: var(--paper); border: 1px solid var(--ink); border-radius: 12px; font-size: 16px; line-height: 1.42; }
  .window::before {
    content: ""; position: absolute; inset: -1px; transform: translate(7px, 7px); z-index: -1;
    background: var(--paper); border: 1px solid var(--ink); border-radius: 12px;
  }
  .titlebar { display: flex; align-items: center; height: 40px; border-bottom: 1px solid var(--ink); }
  .title { flex: 1; display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 16px; }
  .title svg { width: 20px; height: 20px; }
  .controls { display: flex; height: 100%; }
  .controls svg { width: 46px; height: 100%; fill: none; stroke: var(--ink); stroke-width: 1.2; }
  .panes { display: grid; grid-template-columns: 196px 1fr; border-radius: 0 0 11px 11px; overflow: hidden; }
  .chat { padding: 14px; border-right: 1px solid var(--ink); }
  .chat p { margin: 0; }
  .chat .you { width: fit-content; margin: 0 0 12px auto; padding: 6px 10px; border: 1px solid var(--ink); border-radius: 10px; text-wrap: balance; }
  .posting { margin: 10px 0 0; padding-left: 10px; border-left: 2px solid var(--line); }
  .posting .from { color: var(--ink-2); font-size: 14px; }
  .viewer { padding: 16px 16px 14px; background: #ececec; }
  .sheet { padding: 16px 18px 14px; background: var(--paper); border: 1px solid var(--line); font-size: 15px; line-height: 1.42; }
  .sheet p { margin: 0; }
  .sheet .name { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .sheet .contact { color: var(--ink-2); font-size: 13px; }
  .sheet hr { border: 0; border-top: 1px solid var(--ink); margin: 9px 0; }
  .sheet ul { margin: 6px 0 0; padding-left: 1.1em; }
  .approved { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 16px; }
  .approved svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#000"/>
      <rect x="8" y="4" width="16" height="24" fill="#fff"/>
      <rect x="10" y="13" width="12" height="6" fill="#FFE433"/>
      <g stroke="#000" stroke-width="2.4" stroke-linecap="butt">
        <path d="M11 9.5h10"/>
        <path d="M11 16h10"/>
        <path d="M11 22.5h7"/>
      </g>
    </svg>
    CEZ Job Finder
  </div>
  <div class="site">jobs.enrriquez.com</div>
</header>

<div class="intro">
  <h1>A free job-search app for your computer.</h1>
  <p class="lede">Windows and Mac. Works with Claude, ChatGPT or GitHub Copilot.</p>
</div>

<figure>
  <div class="window">
    <div class="titlebar">
      <span class="title"><svg viewBox="0 0 32 32" aria-hidden="true">
<rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#000"/>
<rect x="8" y="4" width="16" height="24" fill="#fff"/>
<rect x="10" y="13" width="12" height="6" fill="#FFE433"/>
<g stroke="#000" stroke-width="2.4" stroke-linecap="butt">
<path d="M11 9.5h10"/>
<path d="M11 16h10"/>
<path d="M11 22.5h7"/>
</g>
</svg>CEZ Job Finder</span>
      <span class="controls">
        <svg viewBox="0 0 46 40"><path d="M18 20h10"/></svg>
        <svg viewBox="0 0 46 40"><rect x="18.5" y="15.5" width="9" height="9" rx="1"/></svg>
        <svg viewBox="0 0 46 40"><path d="M18.5 15.5l9 9M27.5 15.5l-9 9"/></svg>
      </span>
    </div>
    <div class="panes">
      <div class="chat">
        <p class="you">Make my resume for job 12</p>
        <p>Done. 2 lines now use the posting's words. Check them.</p>
        <div class="posting">
          <p class="from">From the posting</p>
          <p>“…lead our <mark>support team</mark> and bring down <mark>wait times</mark>…”</p>
        </div>
      </div>
      <div class="viewer">
        <div class="sheet">
          <p class="name">Your Name</p>
          <p class="contact">City, State | you@example.com</p>
          <hr>
          <p><b>Customer Support Lead</b>, 2021 - now</p>
          <ul>
            <li>Led <mark>support team</mark> of 6 through peak season; cut <mark>wait times</mark> 30%.</li>
          </ul>
        </div>
        <p class="approved"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>You approved this line</p>
      </div>
    </div>
  </div>
</figure>
</body>
</html>
