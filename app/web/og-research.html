<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEZ Job Finder Research share image</title>
<!-- Source of docs/og-research.png (1200x630), the card of every /research/ + /about/ page:
     uv run app/web/assets.py --only og. Tokens + brand mark copied from og.html. Bottom 90px kept
     clear (X lays its headline there; the render fails if anything lands there); key content
     inside the central 1100x530. No numbers on the card: a statistic here would have no source. -->
<style>
  @font-face { font-family: "Caladea"; src: url("/fonts/caladea-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Caladea"; src: url("/fonts/caladea-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; }
  :root { --paper: #ffffff; --ink: #000000; --ink-2: #3a3a3a; --mark: #ffe433; --line: #c8c8c8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: var(--paper); color: var(--ink);
    font: 24px/1.4 "Caladea", serif;
  }
  mark { background: var(--mark); color: var(--ink); padding: 0 0.1em; }

  .top { position: absolute; left: 50px; right: 50px; top: 50px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  .brand svg { width: 44px; height: 44px; }
  .site { font-size: 22px; color: var(--ink-2); }

  .intro { position: absolute; left: 50px; top: 150px; width: 540px; }
  .kicker { margin: 0 0 14px; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 60px; line-height: 1.08; font-weight: 700; letter-spacing: -0.005em; }
  .lede { margin: 24px 0 0; font-size: 26px; line-height: 1.35; color: var(--ink-2); }

  /* one article page as a sheet of paper: a sourced sentence above its Sources list */
  figure { position: absolute; right: 62px; top: 132px; width: 500px; margin: 0; isolation: isolate; }
  .sheet {
    position: relative; padding: 26px 30px 24px; background: var(--paper); border: 1px solid var(--ink); font-size: 20px; line-height: 1.45;
  }
  .sheet::before {
    content: ""; position: absolute; inset: -1px; transform: translate(7px, 7px); z-index: -1;
    background: var(--paper); border: 1px solid var(--ink);
  }
  .sheet p { margin: 0; }
  .bar { height: 10px; margin: 14px 0 0; background: var(--line); border-radius: 2px; }
  .claim { margin: 10px 0 0; }
  .cite { text-decoration: underline; text-underline-offset: 3px; }
  .sources { margin: 24px 0 0; padding: 18px 0 0; border-top: 1px solid var(--ink); }
  .sources h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet .src { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; font-size: 17px; }
  .src .bar { margin: 0; }
  .src svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#000"/>
      <rect x="8" y="4" width="16" height="24" fill="#fff"/>
      <rect x="10" y="13" width="12" height="6" fill="#FFE433"/>
      <g stroke="#000" stroke-width="2.4" stroke-linecap="butt">
        <path d="M11 9.5h10"/>
        <path d="M11 16h10"/>
        <path d="M11 22.5h7"/>
      </g>
    </svg>
    CEZ Job Finder
  </div>
  <div class="site">jobs.enrriquez.com/research</div>
</header>

<div class="intro">
  <p class="kicker">Research</p>
  <h1>AI and resumes: what the evidence says.</h1>
  <p class="lede">Plain answers, every claim linked to its source.</p>
</div>

<figure>
<div class="sheet">
  <div class="bar" style="width: 92%"></div>
  <div class="bar" style="width: 78%"></div>
  <p class="claim"><mark>Each claim names the study behind it</mark> <span class="cite">(Author 2024)</span>.</p>
  <div class="bar" style="width: 86%"></div>
  <div class="sources">
    <h2>Sources</h2>
    <p class="src"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span class="bar" style="width: 380px"></span></p>
    <p class="src"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span class="bar" style="width: 300px"></span></p>
    <p class="src"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><span class="bar" style="width: 340px"></span></p>
  </div>
</div>
</figure>
</body>
</html>
