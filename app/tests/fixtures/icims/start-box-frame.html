<!doctype html>
<!-- the start box's frame, rebuilt from what measure read on 3 tenants (2026-10-03, writes blocked):
     ids, names, types, labels; the privacy tick shows on 1 of 3; an invisible hCaptcha on 3 of 3 -->
<html><body>
<form>
  <h2>Enter Your Information</h2>
  <label for="email">Primary Email Address</label>

  <input type="submit" id="enterEmailSubmitButton" value="Next">
</form>
</body></html>
