  base: example
  patch:
    roles:
      - company: International Association of Distributed Systems and Cloud Infrastructure Engineers, Northern Europe Division
        title: Principal Staff Software Engineer, Platform Reliability and Developer Experience Programme
        location: Remote
        blurb: Customer support platform | https://www.example.com/a/very/long/path/to/the/company/page/about-us
        start: "2023-02"
        end: present
        bullets:
          - Cut checkout latency by moving cart recalculation off the main thread, measured across 12 regional storefronts

resume-dense:
