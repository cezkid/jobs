<!doctype html>
<!-- Workable's form as measured (workable.md "Widgets", tenants A-G, 2026-10-03) + its resume box as its own
     form script draws it (2026-10-06): no live page's markup. Upload goes to /workable-upload.json on this
     host - the test's stand-in for Workable's storage. -->
<html><head><meta charset="utf-8"><title>Acme - Analyst</title>
<style>
  .opt { position: relative; display: flex; gap: 6px; }
  .opt input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
  [role=radio] { width: 14px; height: 14px; border: 1px solid #333; border-radius: 50%; }
  [role=radio][aria-checked=true] { background: #333; }
  [role=listbox] { display: none; border: 1px solid #999; }
  [role=listbox].open { display: block; }
</style></head>
<body>
<form id="application">
  <label for="firstname">First name</label><input id="firstname" name="firstname" required>
  <label for="lastname">Last name</label><input id="lastname" name="lastname" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="input_phone">Phone</label><input id="input_phone" name="phone" type="tel">
  <label for="address">Address</label><input id="address" name="address" value="Example City">
  <input id="city"><input id="postcode"><input id="country">

  <div data-ui="resume">
    <label>Resume</label>
    <span class="hint">Maximum file size 5 MB - acceptable file types .pdf, .doc, .docx, .odt, .rtf.</span>
    <input type="file" id="input_files_input_r4nd0m" accept=".pdf,.doc,.docx,.odt,.rtf">
    <div class="file"></div>
  </div>
  <div><label>Photo</label><input type="file" id="input_files_input_ph0t0" accept=".jpg,.gif,.png"></div>

  <label for="summary">Summary</label><textarea id="summary" name="summary"></textarea>
  <label for="QA_1">Why Acme?</label><textarea id="QA_1" name="QA_1"></textarea>
  <label for="QA_2">* Expected salary</label><input name="QA_2" type="text">

  <fieldset role="radiogroup"><legend>Are you authorized to work in the US?</legend>
    <div class="opt"><input type="radio" name="QA_3" id="r1x" value="true"><div role="radio" aria-checked="false" tabindex="0"></div><span>YES</span></div>
    <div class="opt"><input type="radio" name="QA_3" id="r2x" value="false"><div role="radio" aria-checked="false" tabindex="0"></div><span>NO</span></div>
  </fieldset>

  <fieldset role="radiogroup"><legend>Do you need adjustments?</legend>
    <div class="opt"><input type="radio" name="QA_4" id="r3x" value="1"><div role="radio" aria-checked="false" tabindex="0"></div><svg><text>SVGs not supported by this browser.</text></svg><span>Yes - please add details below</span></div>
    <div class="opt"><input type="radio" name="QA_4" id="r4x" value="2"><div role="radio" aria-checked="false" tabindex="0"></div><svg><text>SVGs not supported by this browser.</text></svg><span>No</span></div>
  </fieldset>

  <fieldset><legend>Which shifts can you work?</legend>
    <label><input type="checkbox" name="152176"> Weekends</label>
    <label><input type="checkbox" name="152177"> Evenings</label>
    <label><input type="checkbox" name="152178"> Holiday</label>
  </fieldset>

  <label>Highest degree</label>
  <div data-ui="CA_1" data-input-type="select">
    <input name="CA_1" type="text" readonly tabindex="-1" style="width:0;height:0;border:0;padding:0">
    <input id="input_CA_1_input" role="combobox" aria-haspopup="listbox" aria-expanded="false" readonly placeholder="Select an option…">
    <ul role="listbox"><li role="option">High School/GED</li><li role="option">Associate</li><li role="option">Bachelor's</li></ul>
  </div>

  <label>Are you 18 or older?</label>
  <div data-ui="CA_2" data-input-type="select">
    <input name="CA_2" type="text" readonly tabindex="-1" style="width:0;height:0;border:0;padding:0">
    <input id="input_CA_2_input" role="combobox" aria-haspopup="listbox" aria-expanded="false" readonly placeholder="Select an option…">
    <ul role="listbox"><li role="option">Yes</li><li role="option">No</li></ul>
  </div>
</form>
<script>
  // radios: the [role=radio] takes the pick, the input under it only mirrors it
  document.querySelectorAll('fieldset[role=radiogroup]').forEach(set => {
    const pick = r => set.querySelectorAll('[role=radio]').forEach(o => {
      o.setAttribute('aria-checked', String(o === r));
      o.parentElement.querySelector('input').checked = o === r;
    });
    set.querySelectorAll('[role=radio]').forEach(r => {
      r.addEventListener('click', () => pick(r));
      r.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); pick(r); } });
    });
  });
  // dropdowns: Down or a click opens the list, a click on an option shows it in the box
  document.querySelectorAll('[data-input-type=select]').forEach(w => {
    const box = w.querySelector('[role=combobox]'), list = w.querySelector('[role=listbox]');
    const open = () => { list.classList.add('open'); box.setAttribute('aria-expanded', 'true'); };
    box.addEventListener('click', open);
    box.addEventListener('keydown', e => { if (e.key === 'ArrowDown') open(); if (e.key === 'Escape') list.classList.remove('open'); });
    list.querySelectorAll('[role=option]').forEach(o => o.addEventListener('click', () => {
      box.value = o.textContent; list.classList.remove('open'); box.setAttribute('aria-expanded', 'false');
    }));
  });
  // resume: too big is the page's own check before anything goes; else it goes to storage at once and the
  // name shows only once stored; a failed upload shows Workable's own words
  const wrap = document.querySelector('[data-ui="resume"]'), row = wrap.querySelector('.file');
  wrap.querySelector('input[type=file]').addEventListener('change', e => {
    const f = e.target.files[0];
    row.textContent = '';
    if (!f) return;
    if (f.size > 5242880) { row.textContent = 'File is too big'; return; }
    fetch('/workable-upload.json', {method: 'POST', body: f}).then(r => {
      if (!r.ok) throw new Error(r.status);
      setTimeout(() => { row.textContent = f.name; }, 300);
    }).catch(() => { row.textContent = 'Something went wrong. We are working on this, please try again later.'; });
  });
</script>
</body></html>
