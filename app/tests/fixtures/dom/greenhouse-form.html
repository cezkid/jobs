<!doctype html>
<!-- A Greenhouse-like form for the in-window fill (apply/window.py) and Chrome (test_dom.py): its widgets as
greenhouse.py meets them (dropdown = react-select markup as measured live 2026-10-05, ids anonymised, css class
hashes + icons left out; checkbox list; file box w/ its filename line), plus what the window made costly when
measured: smooth scrolling and a site's own `debugger;` line. Local only, no requests.
`data-options` / `data-drops` are this page's own (React holds the live list): drops = the page shows a pick,
then empties the box 800 ms later - "once" (the first pick only) or "always" - as a live form showed every
dropdown empty that fill had reported ok (plan-29g.20); the screen-reader log keeps saying it was selected. -->
<html style="scroll-behavior: smooth"><head><meta charset="utf-8"><title>Apply - Acme</title></head><body><form>
<label for="first_name">First Name</label><input type="text" id="first_name" value="Jane">
<label for="email">Email</label><input type="email" id="email">
<div style="height: 2000px"></div>
<div class="field-wrapper"><div class="select" data-options='["Canada", "Cameroon", "United States", "United Kingdom"]'><div class="select__container">
  <label id="question_5-label" for="question_5" class="label select__label">Country of residence<span aria-hidden="true">*</span></label>
  <div class="select-shell"><span id="react-select-question_5-live-region" class="a11yText"></span><span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="a11yText"></span>
    <div><div class="select__control"><div class="select__value-container">
      <div class="select__placeholder" id="react-select-question_5-placeholder">Select...</div>
      <div class="select__input-container" data-value=""><input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="question_5" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_5-label" aria-required="true" role="combobox" enterkeyhint="done" value=""></div>
    </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
    <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div></div>
<div class="field-wrapper"><div class="select" data-options='["Yes", "No"]' data-drops="once"><div class="select__container">
  <label id="question_6-label" for="question_6" class="label select__label">Will you now or in the future require sponsorship for employment visa status?<span aria-hidden="true">*</span></label>
  <div class="select-shell"><span id="react-select-question_6-live-region" class="a11yText"></span><span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="a11yText"></span>
    <div><div class="select__control"><div class="select__value-container">
      <div class="select__placeholder" id="react-select-question_6-placeholder">Select...</div>
      <div class="select__input-container" data-value=""><input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="question_6" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_6-label" aria-required="true" role="combobox" enterkeyhint="done" value=""></div>
    </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
    <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div></div>
<div class="field-wrapper"><div class="select" data-options='["Career Fair", "LinkedIn", "Referral"]' data-drops="always"><div class="select__container">
  <label id="question_7-label" for="question_7" class="label select__label">How did you hear about this job?<span aria-hidden="true">*</span></label>
  <div class="select-shell"><span id="react-select-question_7-live-region" class="a11yText"></span><span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="a11yText"></span>
    <div><div class="select__control"><div class="select__value-container">
      <div class="select__placeholder" id="react-select-question_7-placeholder">Select...</div>
      <div class="select__input-container" data-value=""><input class="select__input" autocapitalize="none" autocomplete="off" autocorrect="off" id="question_7" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_7-label" aria-required="true" role="combobox" enterkeyhint="done" value=""></div>
    </div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div>
    <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div></div>
<div style="height: 2000px"></div>
<fieldset class="checkbox" id="question_100[]">
  <legend>Employment Preference</legend>
  <div><input type="checkbox" id="question_100[]_201" name="question_100[]" value="201" checked><label for="question_100[]_201">Full Time</label></div>
  <div><input type="checkbox" id="question_100[]_202" name="question_100[]" value="202"><label for="question_100[]_202">Part Time</label></div>
  <div><input type="checkbox" id="question_100[]_204" name="question_100[]" value="204"><label for="question_100[]_204">Contract</label></div>
</fieldset>
<div id="upload-label-resume">Resume/CV</div>
<input type="file" id="resume" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<div aria-labelledby="upload-label-resume"><span class="file-upload__filename"></span></div>
</form>
<script>
// a site's own breakpoint: with the debugger attached it would stop the page under the fill
document.getElementById("email").addEventListener("input", () => { debugger; });
document.getElementById("resume").addEventListener("change", (ev) => {
  document.querySelector('[aria-labelledby="upload-label-resume"] .file-upload__filename').textContent = ev.target.files[0].name;
});
for (const input of document.querySelectorAll("input[role=combobox]")) {
  const select = input.closest(".select"), shell = select.querySelector(".select-shell");
  const values = shell.querySelector(".select__value-container"), log = shell.querySelector("[role=log]");
  const options = JSON.parse(select.dataset.options);
  let picks = 0;
  const close = () => { shell.querySelector(".select__menu")?.remove(); input.setAttribute("aria-expanded", "false"); };
  const show = (o) => {
    values.querySelector(".select__single-value, .select__placeholder")?.remove();
    const v = document.createElement("div");
    v.className = o ? "select__single-value" : "select__placeholder";
    v.textContent = o || "Select...";
    values.prepend(v);
    values.classList.toggle("select__value-container--has-value", !!o);
    shell.querySelector(".requiredInput")?.remove();
    if (!o) shell.insertAdjacentHTML("beforeend", '<input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value="">');
  };
  const open = () => {
    close();
    const menu = document.createElement("div");
    menu.className = "select__menu";
    for (const o of options.filter((o) => o.toLowerCase().includes(input.value.toLowerCase()))) {
      const d = document.createElement("div");
      d.setAttribute("role", "option");
      d.textContent = o;
      d.addEventListener("mousedown", (ev) => ev.preventDefault());
      d.addEventListener("click", () => {
        show(o);
        log.textContent = `option ${o}, selected.`;
        input.value = "";
        close();
        picks += 1;
        if (select.dataset.drops === "always" || (select.dataset.drops === "once" && picks === 1)) setTimeout(() => show(""), 800);
      });
      menu.append(d);
    }
    if (menu.children.length) shell.append(menu);
    input.setAttribute("aria-expanded", "true");
  };
  input.addEventListener("input", open);
  input.addEventListener("keydown", (ev) => { if (ev.key === "Escape") close(); });
}
</script></body></html>
