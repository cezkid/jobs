# Keys every profile shares; My Settings/Search settings.yml overrides any of them (mappings merge, lists replace).

# name heads digest subject + TUI title
profile:
  name: jobs

api:
  base: https://freehire.me/api/v1
  page_limit: 100
  timeout_s: 30

# How far back each search looks. Starts at `days` (a pass's own posted_within_days wins);
# a pass returning fewer than `min_jobs` retries at the next of `widen_to`, stops at the last.
# 2026-09-26 live counts, 7/14/30/90 days: finance Springfield 2/7/17/30, legal Denver
# 19/39/70/130, React NYC 253/475/682/1218 => busy searches stay fresh, small ones still fill
# a list. Ends at 90 = rank.old_days: older rows sort low anyway. min_jobs 0 = never widen.
window:
  days: 7
  min_jobs: 30
  widen_to: [14, 30, 60, 90]

# paths relative to repo root
db: .data/jobs.db

# optional email; SMTP over implicit TLS, credentials + recipient in .data/email.env
# absent => daily run notifies on desktop instead
alert:
  smtp_host: smtp.gmail.com
  smtp_port: 465
  timeout_s: 30

# local_daily: autorun.py on this computer's clock, poll + notify/email once; then a quiet check
# every every_hours until last_check (Today + the job list, no message; 0 = morning only)
# poll + digest: systemd calendars for VPS (deploy/render_units.py)
schedule:
  local_daily: "08:00"
  every_hours: 2
  last_check: "22:00"
  poll: "*:0/30"
  digest: "08:00 America/New_York"

# My Resume/ + My Jobs/ gitignored (PII); one folder per job under jobs_dir, in the stage its
# status names (status.STAGES)
resume:
  # typeface the PDF is set in; a folder of that name in app/resume/fonts holds the files
  font: Caladea
  master: My Resume/Resume details.yml
  input_pdf: My Resume/Original resume.pdf
  jobs_dir: My Jobs
  # posting's title added in brackets after a role's own title ("Software Engineer (Frontend)").
  # ask = user confirms each one; always = user said yes to all, added wherever the work matches.
  # Either way never a level word their title lacks (Senior, Lead ...) - tailor check fails it.
  # Never covers the top line (headline): see top_line_title.
  title_mirror: ask
  # top line (headline) of each tailored copy names the posting's title in place of theirs:
  # always = default for everyone (owner 2026-10-12), off = user chose to keep their own top line.
  # Never a level their current title lacks - "Senior" aside, from years in the work (tailor.SENIOR_YEARS)
  top_line_title: always

# Setup answers to the work-permit questions US applications ask. Stay on this computer:
# no job search sends them (only `passes` params go to freehire). null = not asked -> apply asks.
work_authorization:
  # allowed to work in the US for any employer, without restriction. A visa holder (F-1 CPT/OPT,
  # H-1B) is not: their "without restriction" questions are asked each time (apply/questions.work_permit)
  authorized_us: null
  # needs an employer to sponsor a visa, now or later (H-1B; OPT/STEM OPT ending counts).
  # true => jobs freehire marks "no visa sponsorship" sort lower, never hidden
  needs_sponsorship: null
  # US citizen or lawful permanent resident (green card). Asked outright by employers that
  # require it (government work, export-controlled products); refugee/asylee status is not
  citizen_or_permanent_resident: null
  # can hold a US security clearance (citizens only; a green card is not enough). false => jobs
  # asking for one sort lower, never hidden; "needs a security clearance" shows on them either way.
  # null + citizen_or_permanent_resident false counts as false
  can_hold_clearance: null
  # international student (F-1) working through CPT or OPT. true => "authorized ... without
  # restriction" asked on every form (a CPT/OPT permit has limits), "no visa sponsorship" jobs say
  # CPT/OPT may still work, and setup notes off-campus jobs need CPT first. Never sent anywhere
  student_visa: null

# Days w/ no reply before a job shows under Follow up on the Today page, by where it stands.
# Basis + strength: app/docs/apply/follow-up.md. At least 5 (a weekend can take 3). A logged
# follow-up quiets it one more stretch; past that the page suggests closing, never a second chase.
follow_up:
  applied: 21
  heard_back: 15
  interview: 12

# keep the user's own answers from application forms for the next one (My Settings/Saved answers.yml,
# each named before Submit; never work permit, pay filled, or sensitive). null = ask once.
saved_answers: null

# Apply (Today's button, "apply to job N") = the yes to put the resume in the form's resume box: no
# question before the upload. Asked once at the first Apply (null), on unless they say no; false =
# a yes asked before each upload. Named at handover either way (owner 2026-10-13).
upload_on_apply: null

# A form spread over pages (Workday): fill presses the page's own Next / Continue / Save and Continue and
# goes on, stopping at the first page holding something only the user answers, an answer that didn't
# take, or the page's own error - never Submit. Each passed page's answers reach the employer's site then.
# Asked once at the first such form (null); false = the user clicks each one (owner 2026-10-22).
continue_on_apply: null

# An optional "get text messages" box (SMS opt-in) on an application: false = left unticked on every
# form, never stopping the page for it; true = the user decides each one on the page. Asked once at the
# first form showing one (null). A required one stays theirs either way (owner 2026-10-26).
text_messages: null

# The email typed into an employer's sign-in or new-account page (Workday, Taleo, UKG); null = the one on
# the resume. The password is never typed - the user types it and clicks Sign In / Create Account.
account_email: null

# Home address application forms ask for (UKG requires it). Saved only when the user says to keep
# it; never on the resume (full street address = privacy risk, no hiring value). null = asked.
home_address:
  street: null
  city: null
  # full name ("Ohio") - forms pick it off a list by name
  state: null
  # quoted: a ZIP starting with 0 would lose it as a number
  zip: null

# Ranking (rank.py). Order: tier > not seen lately (may be closed) > likely ghost / level /
# hours / sponsorship mismatch / required licence not on the resume > pay floor > pay > employer lists > first seen. Only max_age_days
# (widened per list when thin) and pay_filter hide a job.
rank:
  # open job no check has returned in more than this many days sorts to the bottom of its tier
  # ("may be closed") and is never announced as new: filled jobs outside a pass's
  # posted_within_days window are never re-fetched, so never marked closed. Shown, not hidden:
  # an open job hidden costs the user a chance, a closed one shown costs a click
  stale_days: 14
  # job boards whose links die long before the job search marks the job closed: past this many
  # days from first seen => "link likely dead", sorted + kept off Today like a may-be-closed job.
  # whatjobs 2026-10-23, 161 open rows: every link first seen 7+ days ago (80 checked) opened
  # WhatJobs' home page, 3 of 7 at 4 days; live ones hop on to another board (docs/jobs/freehire.md)
  link_days:
    whatjobs: 6
  # hide jobs freehire first saw more than this many days ago (see rank.age; posted_at is restamped
  # on recrawl, so a 7-day fetch window still returns older jobs). null = keep all. Owner 2026-10-27:
  # "I don't want to see jobs older than 3 days ... if not enough jobs expand"
  max_age_days: 3
  # a list (remote, nearby - best.lists) holding fewer than age_min_jobs live jobs that pass every other
  # filter at that age => its own limit widens to the next of age_widen_to, then no limit. 10 = one
  # Today list. 0 = never widen. Owner's list 2026-10-27, remote / nearby at 1, 3, 7 days: 25/15,
  # 45/34, 94/51 => a busy search stays at 3; a small one fills up from older jobs
  age_min_jobs: 10
  age_widen_to: [5, 7, 14, 30]
  # freehire `reality`: relisted this often (earlier copies that closed = repost_count less
  # mass_posting_count; copies open at once are one role in several places), or listed this many
  # days, or class likely-evergreen => one doubt, sorted below fresh jobs in its tier.
  # 2026-09-24, 500 newest US rows: age_days median 70 on `stale` class (75% of all rows) => 90
  # flags the tail. 2026-09-30, 1,275 open rows: 36 relisted 3+ times
  repost_demote: 3
  old_days: 90
  # setup answers; a title/type that clearly contradicts them sorts lower, never hidden.
  # career_level: entry | mid | senior | leader | null (any). Titles w/o level words untouched; entry + mid
  # sort Senior / Sr / Lead / Principal (mid: Staff too) + director-level titles lower;
  # leader also sorts lower individual-contributor + support titles (coordinator, generalist,
  # specialist, assistant ...) unless the title names a role that leads (rank.below_leader);
  # senior + leader sort numbered first rungs lower ("Analyst I", "Tier 1" - rank.first_rung).
  career_level: null
  # any of full_time part_time contract internship fellowship; [] = doesn't matter.
  # Rows w/o employment_type (~30-45%) never demoted.
  employment_types: []
  # software work only: kinds they do, any of frontend fullstack backend mobile systems infra data qa
  # (app/software.py). A title naming only other kinds - or a plain "Software Engineer" whose skill
  # tags list another kind's stack and none of theirs - sorts lower w/ the reason, never hidden;
  # blocklist.software_kinds hides by title. [] = any. 2026-10-09, front-end + full-stack: 2,000 of
  # 2,000 titles in those categories kept, 97-99% of back-end / mobile / embedded flagged
  software_kinds: []
  # skills they'd rather not work in, as they say them ([Java]): a job whose required lines name one
  # sorts lower w/ "asks Java", never hidden - a line offering a choice ("Python, Node.js, or Java") and
  # a wish ("Java a plus") don't count; a posting listing no requirements counts on the job search's own
  # skill tags ("lists Java"). Whole names: Java never inside JavaScript. [] = none (rank.avoided)
  avoid_skills: []
  # false = they never worked as an engineer or coder - a project / program manager who leads technical
  # work at a high level: a job whose required lines ask that background (worked as an engineer, coding,
  # "strong technical depth") sorts lower w/ "asks an engineer's background", never hidden. A CS degree
  # "or equivalent", managing software projects, "enough technical depth to follow" never count.
  # 2026-10-28, 1,462 live US postings w/ requirements: TPM 36 of 413, technical project manager 21 of 395,
  # IT project manager 2 of 329, program manager 4 of 325 (rank.engineer_asked). null / true = not read
  engineer_background: null
  # yearly USD; a job whose top of range reaches it ranks above those that don't. 0 = no floor
  # (pay_filter then hides nothing)
  salary_floor_usd: 0
  # how they gave it: year, or hour (an internship or part-time job). Kept yearly above either way
  # (hourly x 2080) so every comparison is one sum; hour = said back as "$22/hr", and a part-time
  # job listing only a yearly sum (hours unknown) is never hidden by it
  salary_floor_unit: year
  # hides jobs by pay on every list (Today, chat, email, find); rows stay saved. Owner 2026-10-04:
  # "only if job count is low should lower paying jobs be allowed". Why + measured counts:
  # app/docs/jobs/pay-filter.md
  pay_filter:
    # top of range under salary_floor_usd => hidden
    hide_below_floor: true
    # no pay listed => hidden. Off by default: unlisted pay != low pay, and most postings outside
    # tech list none (owner's list 2026-10-04: 866 of 1,589 open)
    hide_unlisted: false
    # fewer than this many shown jobs reached their list in the last 7 days => hidden ones from
    # that week come back up to it, closest first, each saying why. 0 = never
    relax_under_new_per_week: 25
  # freehire employer lists; only order jobs with no pay listed. bigtech/unicorn/yc are
  # tech-only - add them for a tech search. fortune500 spans every field (54k US rows 2026-09-24)
  boost_collections: [fortune500]
  # what a posting says about its employer, named on the job: faith (religious employer),
  # defense (defense or military work), nonprofit (nonprofit employer - also when the job search's
  # company record calls it one). Set only when the user asks after a note, or at setup for a
  # nonprofit (app/docs/about-me.md); never hides or sorts. [] = never named
  posting_says: []
  # a job a staffing firm posted (rank.staffing_firm: its company record, name or C2C / W2 terms) says
  # "staffing firm" on every list. lower = it sorts lower too; keep = named only (a user who wants
  # contract work through them). blocklist.staffing: true hides them - their choice, counted first
  # (rank --staffing). 2026-10-13: IT project manager 95 of 300 newest rows from one job board, nearly
  # all staffing firms (app/docs/jobs/freehire.md #Staffing firms)
  staffing: lower
  # company spanning this many enrichment categories -> printed by `rank --suspects`
  suspect_min_categories: 5
  # "Best to apply next" (app/best.py): Today page, chat brief, morning email order. Each factor
  # scores 0-1, weighted mean, less `demerit` per rank demerit. Why + basis: app/docs/jobs/best-next.md
  best_next:
    # share of the posting's required asks their resume backs (word overlap, years, degree);
    # weighs most - an ask they can't show is where most applications stop
    match: 0.35
    # asks read as half-backed added to every count, so a share read off few asks stays near the
    # middle: 1 of 1 = 0.67, 8 of 8 = 0.9 (2026-10-11, 1,200 live rows, 4 fields: 4 in 10 list no
    # requirements, their "1 of 1" was the years tag alone and filled the top)
    match_prior: 2
    # share of the title's kind-of-work words found anywhere in their resume (level words left out):
    # an HR director's list had "Tableau Developer" in its top 10. 2026-10-11, 1,050 live titles
    # (finance, HR leader, front-end) each judged same field / adjacent / other by an AI against a
    # fixture resume: top-10 quality (nDCG) 0.55 / 0.97 / 0.82 at 0 => 0.79 / 0.97 / 1.00 at 0.25.
    # 2026-10-12, 1,007 live rows, 4 fields, every job rated 0-3 for fit by an AI: title alone parts
    # good from poor picks 0.86 of the time, match 0.78; top-10 nDCG 0.654 at 0.25, 0.685 at 0.5,
    # 0.695 at 0.7, 0.679 at 0.9 => low end of the plateau. Again w/ Opus ratings + 5 held-out fields:
    # 0.5 best held out under both AIs (Opus 0.635 at 0.35, 0.687 at 0.5, 0.666 at 0.7)
    title: 0.5
    # a plain software title ("Software Engineer") whose required asks never name their kinds of software
    # work (rank.software_kinds: front-end, React ...) keeps this share of its title fit: a senior front-end
    # engineer w/ plain titles of their own had a top 10 of back-end-leaning "Software Engineer" posts.
    # 2026-10-23, 826 live front-end rows, AI-rated: senior top-10 nDCG remote 0.205 => 0.329, nearby
    # 0.314 => 0.342; junior unchanged; 0.3-0.7 the same. Only when software_kinds is set
    plain_title: 0.6
    # fewer asks scores higher: required asks + lead/manage duties (each twice; once for a leader), full marks at
    # asks_light or fewer, none at asks_heavy (2026-10-04, 944 live US rows, 7 occupations: 449
    # list required asks, median 7, top tenth 12+, 14 at 16+); a level 2+ rungs above career_level halves it
    asks: 0.15
    asks_light: 8
    asks_heavy: 16
    # place among the listed pay of the jobs scored; under salary_floor_usd halves it; not listed 0.25
    pay: 0.2
    # their own where-first order (passes): first tier 1, last 0
    where: 0.15
    # Today's two lists (remote, nearby) read `where` as place in place of it: a remote job open to where
    # they live, a nearby one's office in their area. 2026-10-23, 826 live front-end rows (remote US + North
    # Jersey / NYC), 2 resumes, every job rated by an AI for fit + "can they work it from home": top-10
    # nDCG junior 0.606 / 0.571 => 0.662 / 0.649 (remote / nearby) at 0.3; 0.15 / 0.5 / 0.8 lower; senior unmoved
    place: 0.3
    # a nearby job's office this many miles from home or closer scores full place, none at far_miles, straight
    # between (app/places.py: straight line from their saved home address, else their resume's town). Owner
    # 2026-10-26: "pay is important but so is distance". 40 miles straight ~ an hour or more by road or rail
    # around a big city - convention, not a study. Office unknown => the old place reading (tier city / state)
    near_miles: 10
    far_miles: 40
    # newer posting first: 1 posted today, 0 at fresh_days
    fresh: 0.15
    fresh_days: 21
    # posted within the first window (days) go first, best first among them; fewer than
    # fresh_enough there => widen to the next until it holds that many, then the next group
    # (owner 2026-10-08: top picks sat 5-7 days old while 19 went up in the last day)
    fresh_windows: [1, 2, 3, 5, 7, 14, 21]
    # only the first this many come from the freshest window; the rest by score at any age (fresh still
    # weighs). 2026-10-12, 2,454 live rows, 9 resumes, every job rated for fit by an AI (Sonnet; again by
    # Opus, high effort): top-10 nDCG held out (security, compliance, PM, junior front-end, FP&A) 0.452 =>
    # 0.555 / 0.553 => 0.689; the 4 tuning fields w/ their level 0.688 => 0.739 / 0.784 => 0.803; HR leader
    # loses (0.92 => 0.84 / 0.95 => 0.82). 3 ties held out, 7 loses. null = every job in window order
    fresh_first: 5
    fresh_enough: 5
    # taken off per demerit rank already counts (likely ghost, level/hours mismatch, no sponsor,
    # clearance they can't hold, staffing firm - rank.demerits)
    demerit: 0.15
    # taken off per job from the same employer placed above it, so one employer doesn't fill the
    # list; one posting under two company names (an aggregator's copy) sinks as `twin`. Order only
    repeat: 0.1
    twin: 0.5
