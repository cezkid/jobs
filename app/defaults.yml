# Keys every profile shares; My Settings/Search settings.yml overrides any of them (mappings merge, lists replace).

# name heads digest subject + TUI title
profile:
  name: jobs

api:
  base: https://freehire.me/api/v1
  page_limit: 100
  timeout_s: 30

# How far back each search looks. Starts at `days` (a pass's own posted_within_days wins);
# a pass returning fewer than `min_jobs` retries at the next of `widen_to`, stops at the last.
# 2026-09-26 live counts, 7/14/30/90 days: finance Springfield 2/7/17/30, legal Denver
# 19/39/70/130, React NYC 253/475/682/1218 => busy searches stay fresh, small ones still fill
# a list. Ends at 90 = rank.old_days: older rows sort low anyway. min_jobs 0 = never widen.
window:
  days: 7
  min_jobs: 30
  widen_to: [14, 30, 60, 90]

# paths relative to repo root
db: .data/jobs.db

# optional email; SMTP over implicit TLS, credentials + recipient in .data/email.env
# absent => daily run notifies on desktop instead
alert:
  smtp_host: smtp.gmail.com
  smtp_port: 465
  timeout_s: 30

# local_daily: autorun.py on this computer's clock, poll + notify/email once
# poll + digest: systemd calendars for VPS (deploy/render_units.py)
schedule:
  local_daily: "08:00"
  poll: "*:0/30"
  digest: "08:00 America/New_York"

# My Resume/ + My Jobs/ gitignored (PII); one folder per job under jobs_dir
resume:
  # typeface the PDF is set in; a folder of that name in app/resume/fonts holds the files
  font: Caladea
  master: My Resume/Resume details.yml
  input_pdf: My Resume/Original resume.pdf
  jobs_dir: My Jobs

# Setup answers to the two questions nearly every US application asks. Stay on this computer:
# no job search sends them (only `passes` params go to freehire). null = not asked -> apply asks.
work_authorization:
  # allowed to work in the US for any employer, without restriction
  authorized_us: null
  # needs an employer to sponsor a visa, now or later (H-1B; OPT/STEM OPT ending counts).
  # true => jobs freehire marks "no visa sponsorship" sort lower, never hidden
  needs_sponsorship: null

# Ranking (rank.py). Order: tier > not seen lately (may be closed) > likely ghost / level /
# hours / sponsorship mismatch > pay floor > pay > employer lists > first seen. Nothing here hides a job.
rank:
  # open job no check has returned in more than this many days sorts to the bottom of its tier
  # ("may be closed") and is never announced as new: filled jobs outside a pass's
  # posted_within_days window are never re-fetched, so never marked closed. Shown, not hidden:
  # an open job hidden costs the user a chance, a closed one shown costs a click
  stale_days: 14
  # freehire `reality`: relisted this often, or listed this many days, or class likely-evergreen
  # => sorted below fresh jobs in its tier. 2026-09-24, 500 newest US rows: repost_count 1 on
  # 446, 3+ on 19; age_days median 70 on `stale` class (75% of all rows) => 90 flags the tail
  repost_demote: 3
  old_days: 90
  # setup answers; a title/type that clearly contradicts them sorts lower, never hidden.
  # career_level: entry | mid | senior | leader | null (any). Titles w/o level words untouched.
  career_level: null
  # any of full_time part_time contract internship fellowship; [] = doesn't matter.
  # Rows w/o employment_type (~30-45%) never demoted.
  employment_types: []
  # yearly USD; a job whose top of range reaches it ranks above those that don't. Boost only.
  salary_floor_usd: 0
  # freehire employer lists; only order jobs with no pay listed. bigtech/unicorn/yc are
  # tech-only - add them for a tech search. fortune500 spans every field (54k US rows 2026-09-24)
  boost_collections: [fortune500]
  # company spanning this many enrichment categories -> printed by `rank --suspects`
  suspect_min_categories: 5
