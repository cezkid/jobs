<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<desc>CEZ Job Finder icon, route "disc": the blackbird in ink on a paper-white disc, on the ink tile. Apple 1024 grid: tile 824 at 100, r 185, unchanged. Disc r 288 at 498,506 (14 left and 6 above the tile's centre, so disc plus beak sit centred and the shadow has room), paper gradient, plain edge, soft shadow under it. Bird = mark.svg's shapes in one group, scale 2.2: ink box 528 wide, 64 percent of the tile. Disc placed against the bird, not round it: head 6 bird-units inside the edge at 42 degrees, so the beak leaves the paper 15 units after it leaves the head and its point (25 units) lies on the dark tile; tail 20 units inside; the legs run to the disc's lower edge and end there - the stage clip (disc + 1.5, plus the quarter the beak leaves through) cuts black that would otherwise lie on the dark tile.</desc>
<defs>
<filter id="bsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/></filter>
<filter id="bsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/></filter>
<linearGradient id="bpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece8de"/></linearGradient>
<radialGradient id="bink" cx="0.5" cy="0.18" r="0.95"><stop offset="0" stop-color="#3a3a40"/><stop offset="1" stop-color="#0c0c0e"/></radialGradient>
<clipPath id="bclip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<clipPath id="bstage"><circle cx="498" cy="506" r="289.5"/><rect x="498" y="100" width="426" height="406"/></clipPath>
</defs>
<g filter="url(#bsh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bink)"/></g>
<rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
<g clip-path="url(#bclip)">
<g filter="url(#bsoft)"><circle id="disc" cx="498" cy="506" r="288" fill="url(#bpaper)"/></g>
<g clip-path="url(#bstage)">
<g id="bird" transform="translate(271 268) scale(2.2)">
<path fill="#000000" d="M99.23 74.26 L8 165.49 L17.04 190.39 L38.53 168.9 A24 24 0 0 1 75.27 172.27 A64 64 0 0 0 190.59 122.64 A48 48 0 0 1 198.77 84.31 A48 48 0 1 0 112.64 48.16 A48 48 0 0 1 99.23 74.26 Z"/>
<path fill="#000000" d="M116 180 H132 V248 H116 Z M148 180 H164 V248 H148 Z"/>
<path fill="#ffe433" d="M185.37 40.34 L237.33 53.33 A2.75 2.75 0 0 1 237.33 58.67 L185.37 71.66 A48 48 0 0 0 185.37 40.34 Z"/>
<circle cx="156" cy="36" r="11" fill="#ffe433"/>
<circle cx="156" cy="36" r="5.5" fill="#000000"/>
</g>
</g>
</g>
</svg>
